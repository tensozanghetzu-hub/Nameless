name: Nameless checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nameless-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI_MODE: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
        with:
          persist-credentials: false
      - name: Use Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4, pinned
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;37.0.0'
          chmod +x gradlew build-nameless.sh
      - name: Test release tooling
        run: python3 -m unittest discover -s tools/tests -v
      - name: Test Android code
        run: ./gradlew :android:testStandardReleaseUnitTest --no-daemon --console=plain
      - name: Build unsigned standard release
        run: ./gradlew :android:assembleStandardRelease --no-daemon --console=plain
