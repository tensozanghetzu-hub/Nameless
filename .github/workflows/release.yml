name: Publish signed Nameless update

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build/retry, e.g. v55"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: nameless-release-publishing
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'tensozanghetzu-hub/Nameless' && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI_MODE: "true"
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4, pinned
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate release version
        id: version
        run: python3 tools/nameless_release.py version "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - name: Reject backwards release ordering
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/nameless-releases.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          pages = json.loads((Path(os.environ['RUNNER_TEMP']) / 'nameless-releases.json').read_text())
          code = int(os.environ['VERSION_CODE'])
          for page in pages:
              for release in page:
                  if release.get('draft') or release.get('prerelease'):
                      continue
                  match = re.fullmatch(r'v([1-9][0-9]{1,8})', release['tag_name'])
                  if match and int(match[1]) > code:
                      raise SystemExit('A newer stable release already exists; use a higher vNN tag.')
          PY
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;37.0.0'
          chmod +x gradlew build-nameless.sh
      - name: Test release tooling
        run: python3 -m unittest discover -s tools/tests -v
      - name: Test Android update and reader code
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew :android:testStandardReleaseUnitTest --no-daemon --console=plain -PnamelessVersionCode="$VERSION_CODE" -PnamelessVersionName="$VERSION_NAME"
      - name: Build standard release
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew :android:assembleStandardRelease --no-daemon --console=plain -PnamelessVersionCode="$VERSION_CODE" -PnamelessVersionName="$VERSION_NAME"
      - name: Sign and validate the original Nameless identity
        env:
          NAMELESS_KEYSTORE_BASE64: ${{ secrets.NAMELESS_KEYSTORE_BASE64 }}
          NAMELESS_KEYSTORE_PASSWORD: ${{ secrets.NAMELESS_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$NAMELESS_KEYSTORE_BASE64" ] || [ -z "$NAMELESS_KEYSTORE_PASSWORD" ]; then
            echo 'Add NAMELESS_KEYSTORE_BASE64 and NAMELESS_KEYSTORE_PASSWORD in repository Actions secrets.'
            exit 1
          fi
          # Copy/paste may add CR/LF; generated Nameless passwords are single-line.
          export NAMELESS_KEYSTORE_PASSWORD="${NAMELESS_KEYSTORE_PASSWORD//$'\r'/}"
          export NAMELESS_KEYSTORE_PASSWORD="${NAMELESS_KEYSTORE_PASSWORD//$'\n'/}"
          umask 077
          KEYSTORE="$RUNNER_TEMP/nameless-release-key.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          export KEYSTORE
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path(os.environ['KEYSTORE']).write_bytes(base64.b64decode(''.join(os.environ['NAMELESS_KEYSTORE_BASE64'].split()), validate=True))
          PY
          TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          "$TOOLS/zipalign" -P 16 -f 4 android/build/outputs/apk/standard/release/Nameless-standard-release-unsigned.apk "$RUNNER_TEMP/nameless-aligned.apk"
          "$TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias nameless --ks-pass env:NAMELESS_KEYSTORE_PASSWORD --v4-signing-enabled false --out "$RUNNER_TEMP/nameless-signed.apk" "$RUNNER_TEMP/nameless-aligned.apk"
          python3 tools/nameless_release.py package --root . --apk "$RUNNER_TEMP/nameless-signed.apk" --tag "$RELEASE_TAG" --output release-assets --tools "$TOOLS" --event "$GITHUB_EVENT_PATH"
      - name: Attach verified APK, GPL source and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
