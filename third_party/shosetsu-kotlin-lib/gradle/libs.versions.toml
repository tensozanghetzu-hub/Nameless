[versions]
jsoup = "1.18.3"
luaj = "3.0.1"
okhttp = "4.12.0"
guava = "33.4.0-jre"
kotlin = "2.1.0"
dokka = "2.0.0" # should generally match kotlins version
kdt = "0.6.1"
ksJson = "1.8.0"

[libraries]
dokka-kajp = { module = "org.jetbrains.dokka:kotlin-as-java-plugin", version.ref = "dokka" }
# Core libraries
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "ksJson" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kdt" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
luaj-jse = { module = "org.luaj:luaj-jse", version.ref = "luaj" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }

[plugins]
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }